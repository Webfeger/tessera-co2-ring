id: co2_ring
version: 0.2.0
api: "0.15"
icon: molecule-co2
maintainer: Webfeger
license: MIT
stage: beta
topics: [home, weather]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 12
tiles:
  - id: co2
    name: tile_name
    icon: molecule-co2
    sizes: { min: 1x1, max: 2x3 }
    memory: 900
    example: tile_example
    options:
      - { id: sensor, kind: entity, domains: [sensor, air_quality, number], label: sensor, hint: sensor_hint }
      - { id: low_threshold, kind: number, min: 400, max: 3000, step: 50, unit: ppm, default: 800, label: low_threshold, hint: low_threshold_hint }
      - { id: high_threshold, kind: number, min: 450, max: 5000, step: 50, unit: ppm, default: 1200, label: high_threshold, hint: high_threshold_hint }
      - { id: low_color, kind: choice, choices: [{ value: green, label: color_green }, { value: lime, label: color_lime }, { value: teal, label: color_teal }, { value: blue, label: color_blue }, { value: yellow, label: color_yellow }, { value: orange, label: color_orange }, { value: red, label: color_red }, { value: purple, label: color_purple }], default: green, label: low_color, hint: low_color_hint }
      - { id: mid_color, kind: choice, choices: [{ value: green, label: color_green }, { value: lime, label: color_lime }, { value: teal, label: color_teal }, { value: blue, label: color_blue }, { value: yellow, label: color_yellow }, { value: orange, label: color_orange }, { value: red, label: color_red }, { value: purple, label: color_purple }], default: yellow, label: mid_color, hint: mid_color_hint }
      - { id: high_color, kind: choice, choices: [{ value: green, label: color_green }, { value: lime, label: color_lime }, { value: teal, label: color_teal }, { value: blue, label: color_blue }, { value: yellow, label: color_yellow }, { value: orange, label: color_orange }, { value: red, label: color_red }, { value: purple, label: color_purple }], default: red, label: high_color, hint: high_color_hint }
